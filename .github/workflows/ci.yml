name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Sur main, on ne coupe jamais un run en cours : il peut être en pleine migration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Lecture seule, sauf pour les jobs qui en demandent plus.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests unitaires
        run: npm test

  e2e:
    name: API e2e (Postgres + MinIO)
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: langestloc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d langestloc_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Valeurs jetables, en clair : masquées comme des secrets, un job rouge serait illisible.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/langestloc_ci
      PORT: 3999
      JWT_SECRET: ci-jwt-secret
      JWT_EXPIRES_IN: 1h
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ciaccesskey
      S3_SECRET_KEY: cisecretkey123
      S3_REGION: eu-west-3
      S3_BUCKET: langestloc-ci
      BAILLEUR_NAME: CI Bailleur
      BAILLEUR_LIEU: Conakry
      BAILLEUR_REP: CI Representant
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: CiAdmin123
      ADMIN_NAME: CI Admin
      USER_EMAIL: user@ci.local
      USER_PASSWORD: CiUser123
      USER_NAME: CI User

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      # RustFS remplace MinIO, dont les images ont disparu. Le job garde « MinIO »
      # dans son nom parce que le ruleset de main le cite tel quel.
      - name: Démarrer le stockage S3 (RustFS)
        run: |
          docker run -d --name s3 \
            -e RUSTFS_ACCESS_KEY="$S3_ACCESS_KEY" \
            -e RUSTFS_SECRET_KEY="$S3_SECRET_KEY" \
            -p 9000:9000 \
            rustfs/rustfs:1.0.0

      - name: Attendre le stockage S3
        run: |
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:9000/health/ready; then
              echo "Stockage S3 prêt"
              exit 0
            fi
            sleep 2
          done
          echo "Le stockage S3 n'a pas démarré"
          docker logs s3
          exit 1

      - name: Appliquer les migrations
        run: npx prisma migrate deploy

      - name: Charger le jeu de données
        run: npx prisma db seed

      - name: Build
        run: npm run build

      - name: Démarrer l'API
        run: |
          npm run start:prod > /tmp/api.log 2>&1 &
          for _ in $(seq 1 45); do
            if curl -sf -o /dev/null "http://localhost:$PORT/api-json"; then
              echo "API prête"
              exit 0
            fi
            sleep 2
          done
          echo "L'API n'a pas démarré"
          cat /tmp/api.log
          exit 1

      - name: Tests bout-en-bout
        run: npm run test:smoke

      - name: Journal de l'API (en cas d'échec)
        if: failure()
        run: |
          cat /tmp/api.log || echo "aucun journal, l'API n'a jamais démarré"

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Image Docker (build, vérification, push GHCR)
    runs-on: ubuntu-latest
    needs: [backend, e2e]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: langestloc_image
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d langestloc_image"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Tag = SHA du commit, jamais latest
      IMAGE: ghcr.io/cheickla/langestloc-api:${{ github.sha }}
      DATABASE_URL: postgresql://ci:ci@localhost:5432/langestloc_image

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'image (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          # Relie le paquet GHCR au repo (droits hérités)
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Appliquer les migrations avec l'image
        run: docker run --rm --network host -e DATABASE_URL "$IMAGE" npx prisma migrate deploy

      - name: Démarrer l'API (mode production)
        # Valeurs factices : un S3 injoignable n'empêche pas le démarrage.
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL -e PORT=3000 \
            -e JWT_SECRET=ci-image-secret \
            -e S3_ENDPOINT=http://127.0.0.1:9 -e S3_REGION=eu-west-3 \
            -e S3_BUCKET=langestloc-image -e S3_ACCESS_KEY=ci -e S3_SECRET_KEY=ci \
            -e BAILLEUR_NAME="CI Bailleur" -e BAILLEUR_LIEU=Conakry \
            "$IMAGE"

      - name: Vérifier /health et l'absence de Swagger
        run: |
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/health; then
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/health | grep -q '"status":"ok"'
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api-json)
          if [ "$status" != "404" ]; then
            echo "Swagger exposé en production (HTTP $status)"
            exit 1
          fi

      - name: Vérifier les polices des PDF dans l'image
        run: >-
          docker run --rm --entrypoint ls "$IMAGE"
          assets/fonts/Geist-Regular.ttf assets/fonts/Geist-Medium.ttf assets/fonts/Geist-SemiBold.ttf
          assets/fonts/GeistMono-Regular.ttf assets/fonts/GeistMono-Medium.ttf

      - name: Journal de l'API (en cas d'échec)
        if: failure()
        run: docker logs api || echo "aucun conteneur api"

      - name: Publier l'image vérifiée sur GHCR
        # L'image testée ci-dessus, sans la reconstruire
        run: docker push "$IMAGE"

  deploy:
    name: Déploiement API (VPS)
    runs-on: ubuntu-latest
    needs: [image, frontend]
    if: github.ref == 'refs/heads/main'
    environment: vps
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      SSH_TARGET: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ssh/scp du runner plutôt qu'une action tierce : la clé donne tous les droits sur le VPS.
      - name: Préparer SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF

      - name: Envoyer les fichiers de déploiement
        run: |
          ssh "$SSH_TARGET" 'mkdir -p /opt/langestloc/incoming'
          scp deploy/compose.prod.yml deploy/*.sh "$SSH_TARGET:/opt/langestloc/incoming/"

      # Le jeton passe par l'entrée standard pour ne pas apparaître dans ps sur le serveur.
      - name: Déployer sur le VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2029
          printf '%s\n' "$GHCR_TOKEN" \
            | ssh "$SSH_TARGET" "bash /opt/langestloc/incoming/deploy.sh '$GITHUB_SHA' '$GITHUB_ACTOR'"

      - name: Vérifier l'API depuis Internet
        run: |
          for _ in $(seq 1 10); do
            if curl -sf -m 10 https://api.langestloc.cheickla.fr/health | grep -q '"status":"ok"'; then
              echo "API en ligne"
              exit 0
            fi
            sleep 3
          done
          echo "https://api.langestloc.cheickla.fr/health ne répond pas"
          exit 1
