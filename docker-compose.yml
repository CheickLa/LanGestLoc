services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 3001
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/generated
    command: sh -c "rm -rf dist && npm install && npx prisma generate && npm run start:dev"
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/node_modules/.package-lock.json"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  prisma-studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prisma-studio
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_started
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/generated
    command: >
      sh -c "
        apk add --no-cache socat &&
        npx prisma generate &&
        npx prisma studio --browser none --port 5556 &
        sleep 3 &&
        socat TCP-LISTEN:5555,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:5556
      "

volumes:
  postgres_data: